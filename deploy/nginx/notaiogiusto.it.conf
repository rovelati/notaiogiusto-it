# HTTP -> HTTPS (preserve host; apex then 301 to www on 443)
server {
    listen 80;
    listen [::]:80;
    server_name notaiogiusto.it www.notaiogiusto.it;
    return 301 https://$host$request_uri;
}

# apex HTTPS -> www HTTPS
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name notaiogiusto.it;

    ssl_certificate /etc/letsencrypt/live/www.notaiogiusto.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.notaiogiusto.it/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://www.notaiogiusto.it$request_uri;
}

# www HTTPS -> app
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.notaiogiusto.it;

    ssl_certificate /etc/letsencrypt/live/www.notaiogiusto.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.notaiogiusto.it/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 256;

    location ~* \.(js|css|png|jpg|jpeg|webp|gif|ico|svg|woff2?)$ {
        proxy_pass http://127.0.0.1:4330;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:4330;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
